name: transit image (GHCR)

# Builds this fork's image and pushes it to ghcr.io/<owner>/transit.
# - push to the `transit` branch  -> :latest and :sha-<short>
# - push a tag `transit-v*`       -> :<tag>
# Upstream workflows in .github/workflows are disabled in the fork's Actions UI
# (they need Docker Hub secrets we do not have); do not delete them or the
# next rebase conflicts.

on:
  push:
    branches: [transit]
    tags: ["transit-v*"]
  workflow_dispatch:

concurrency:
  group: transit-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Write VERSION
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "${GITHUB_REF_NAME}" > VERSION
          else
            echo "transit-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)" > VERSION
          fi
          echo "VERSION=$(cat VERSION)"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/transit
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/transit' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/transit' }}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Single VPS, amd64 only. Add linux/arm64 here if the box changes.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
