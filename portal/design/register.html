<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · transit</title>
<link rel="stylesheet" href="bento.css">
<style>
  .states { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; width: min(960px, 100%); }
  .states > div { display: grid; justify-items: center; }
  .states .auth-card { width: min(400px, 100%); }
  .state-label { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-tertiary); margin-bottom: 14px; }
  .inviter { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--accent-tint); margin-bottom: 18px; font-size: 12.5px; }
  .inviter .avatar { width: 26px; height: 26px; font-size: 10px; background: #fff; }
  .inviter b { font-weight: 600; }
  .strength { display: flex; gap: 4px; margin-top: 6px; }
  .strength i { flex: 1; height: 3px; border-radius: 2px; background: rgba(0,0,0,0.08); }
  .strength i.on { background: var(--green); }
  @media (max-width: 900px) { .states { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bg-glow"></div>

<div class="auth-shell">
  <div class="states">
    <!-- 状态 A：带邀请码打开 -->
    <div>
      <div class="state-label">状态 A · 通过邀请链接打开（?aff=s3XR）</div>
      <div class="auth-card rise">
        <a class="auth-brand" href="#"><div class="brand-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><b>transit</b></a>
        <div class="card static" style="padding: 26px 26px 22px;">
          <h1>创建账号</h1>
          <p class="lead">注册后即可创建密钥、开始调用。</p>
          <div class="inviter"><div class="avatar">XK</div><span><b>XK</b> 邀请你加入 · 邀请码 <span class="mono">s3XR</span></span></div>
          <form class="form-grid" onsubmit="return false">
            <div class="field"><label>用户名</label><input class="input" placeholder="最多 12 个字符" value="alice"><span class="hint">登录用，之后不可修改。</span></div>
            <div class="field"><label>密码</label><input class="input" type="password" value="••••••••••••"><div class="strength"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div><span class="hint">至少 8 位。</span></div>
            <div class="field"><label>确认密码</label><input class="input" type="password" value="••••••••••••"></div>
            <button class="btn btn-primary btn-lg btn-block" style="margin-top: 4px;">注册</button>
          </form>
        </div>
        <div class="auth-foot">已有账号？<a href="sign-in.html">登录</a></div>
      </div>
    </div>

    <!-- 状态 B：直接打开，没有邀请码 -->
    <div>
      <div class="state-label">状态 B · 没有邀请码</div>
      <div class="auth-card rise" style="--i:2">
        <a class="auth-brand" href="#"><div class="brand-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><b>transit</b></a>
        <div class="card static" style="padding: 26px 26px 22px;">
          <h1>仅限邀请</h1>
          <p class="lead">本站不开放公开注册。</p>
          <div class="notice">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
            <div>请通过朋友发给你的邀请链接打开本页，链接形如下方。链接里的邀请码会自动识别，不需要手动输入。</div>
          </div>
          <div class="code-view" style="margin-top: 14px; font-size: 12px;">https://api.transit.local/register?aff=<span class="k">XXXX</span></div>
          <a class="btn btn-ghost btn-block" href="sign-in.html" style="margin-top: 16px;">我已有账号，去登录</a>
        </div>
        <div class="auth-foot">邀请码只用于准入，不产生任何返利。</div>
      </div>
    </div>
  </div>
</div>
<script src="bento.js"></script>
</body>
</html>
