<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · transit</title>
<link rel="stylesheet" href="bento.css">
<style>
  .states { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; width: min(960px, 100%); }
  .states > div { display: grid; justify-items: center; }
  .states .auth-card { width: min(400px, 100%); }
  .state-label { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-tertiary); margin-bottom: 14px; }
  .otp { display: flex; gap: 8px; }
  .otp .input { text-align: center; font-family: var(--font-mono); font-size: 20px; height: 48px; padding: 0; font-weight: 600; }
  @media (max-width: 900px) { .states { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bg-glow"></div>

<div class="auth-shell">
  <div class="states">
    <!-- 状态 A：账号密码 -->
    <div>
      <div class="state-label">状态 A · 默认</div>
      <div class="auth-card rise">
        <a class="auth-brand" href="#"><div class="brand-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><b>transit</b></a>
        <div class="card static" style="padding: 26px 26px 22px;">
          <h1>登录</h1>
          <p class="lead">仅限邀请的私人网关。</p>
          <form class="form-grid" onsubmit="return false">
            <div class="field"><label>用户名</label><input class="input" value="xk" autocomplete="username"></div>
            <div class="field"><label>密码</label><input class="input" type="password" value="••••••••••••" autocomplete="current-password"></div>
            <button class="btn btn-primary btn-lg btn-block" style="margin-top: 4px;">登录</button>
          </form>
        </div>
        <div class="auth-foot">还没有账号？收到邀请链接的朋友请直接打开链接注册。</div>
      </div>
    </div>

    <!-- 状态 B：两步验证 -->
    <div>
      <div class="state-label">状态 B · 开启了两步验证</div>
      <div class="auth-card rise" style="--i:2">
        <a class="auth-brand" href="#"><div class="brand-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><b>transit</b></a>
        <div class="card static" style="padding: 26px 26px 22px;">
          <h1>两步验证</h1>
          <p class="lead">输入验证器 App 里 <b style="color:var(--ink)">xk</b> 账号当前的 6 位动态码。</p>
          <form class="form-grid" onsubmit="return false">
            <div class="otp">
              <input class="input" maxlength="1" value="4"><input class="input" maxlength="1" value="8"><input class="input" maxlength="1" value="2"><input class="input" maxlength="1"><input class="input" maxlength="1"><input class="input" maxlength="1">
            </div>
            <button class="btn btn-primary btn-lg btn-block" style="margin-top: 4px;">验证并登录</button>
            <button class="btn btn-ghost btn-block">返回重新输入密码</button>
          </form>
        </div>
        <div class="auth-foot">动态码 30 秒刷新一次，过期请重新输入。</div>
      </div>
    </div>
  </div>
</div>
<script src="bento.js"></script>
</body>
</html>
